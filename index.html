<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0d11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Wishlist</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0d11;color:white}main{max-width:550px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px 110px}h1{font-size:30px;margin:0 0 6px}h2{font-size:21px;margin:24px 0 15px}.muted{color:#9a9ba7;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.top button{font-size:22px}.card{background:#1d2028;border-radius:19px;padding:18px;margin:12px 0}.eyebrow{font-size:12px;letter-spacing:1px;color:#c7c8d0}.timer{font-size:37px;color:#ffb563;font-weight:750;font-variant-numeric:tabular-nums;margin:10px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border:1px solid #454751;border-radius:25px;padding:8px 12px;background:transparent;color:#eee}.pill.active,.primary{background:#ffb563;color:#171717;border:0}.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product{background:#1c1d24;border-radius:15px;overflow:hidden}.photo{height:142px;background:#292b33;display:flex;align-items:center;justify-content:center;font-size:55px}.photo img{width:100%;height:100%;object-fit:cover}.product .info{padding:12px}.product .name{font-weight:650;margin:7px 0;min-height:36px}.orange{color:#ffb563}.green{color:#69d5aa}button{cursor:pointer;color:inherit;font:inherit}button:disabled{opacity:.4}button.ghost{border:0;background:transparent;padding:8px 0}button.action{background:#ffb563;color:#151515;border:0;border-radius:13px;padding:15px;font-weight:750;width:100%}.secondary{background:#282b35;border:1px solid #41434d;border-radius:12px;padding:12px;color:white}.danger{border:1px solid #a44c4c;color:#ff9292;background:transparent;border-radius:12px;padding:13px;width:100%}.field{display:block;margin:16px 0}.field span{display:block;font-size:13px;color:#b9bac4;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #42444e;background:#252730;border-radius:11px;color:white;font-size:16px}input[type=checkbox]{width:auto;accent-color:#ffb563}.nav{position:fixed;bottom:0;left:0;right:0;background:#15161cf5;border-top:1px solid #30313a;padding:12px 8px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-around;z-index:5}.nav button{background:transparent;border:0;color:#858692;display:grid;gap:5px;justify-items:center;font-size:11px;min-width:60px}.nav button.current{color:#ffb563}.nav .symbol{font-size:23px}.listrow{display:flex;align-items:center;justify-content:space-between;background:#1d1f27;border-radius:16px;padding:19px;margin:10px 0}.small{font-size:12px}.hide{display:none!important}.subitem{padding:13px 0;border-top:1px solid #393b46}.hero{height:220px;border-radius:17px;background:#292b33;display:grid;place-items:center;font-size:80px;overflow:hidden}.hero img{width:100%;height:100%;object-fit:contain}a{color:inherit;text-decoration:none}.notice{font-size:12px;color:#8e909c;margin-top:10px;line-height:1.5}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><script src="app.js"></script></body></html>
